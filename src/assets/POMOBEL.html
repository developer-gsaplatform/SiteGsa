<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomobel Supermercados — Dashboard de Gestão</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="css/styles.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <!-- SheetJS para Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- EmailJS (simulado) -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3.11.0/dist/email.min.js"></script>
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Botão Mobile -->
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">
        <i class="fas fa-bars"></i>
    </button>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-container">
                <img src="assets/logo.png" alt="Pomobel Supermercados" class="logo">
            </div>
            <div class="brand-info">
                <h2>Pomobel</h2>
                <span>Supermercados</span>
            </div>
        </div>

        <div class="user-info">
            <div class="user-avatar">
                <i class="fas fa-user-tie"></i>
            </div>
            <div class="user-details">
                <strong>Admin Geral</strong>
                <small>Direção</small>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section">
                <span class="nav-title">Principal</span>
                <a href="#" class="nav-item active" data-section="dashboard">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-section="vendas">
                    <i class="fas fa-cash-register"></i>
                    <span>Vendas</span>
                    <span class="badge">14</span>
                </a>
                <a href="#" class="nav-item" data-section="postos">
                    <i class="fas fa-store"></i>
                    <span>Postos</span>
                </a>
            </div>

            <div class="nav-section">
                <span class="nav-title">Gestão</span>
                <a href="#" class="nav-item" data-section="rh">
                    <i class="fas fa-users"></i>
                    <span>RH</span>
                </a>
                <a href="#" class="nav-item" data-section="financas">
                    <i class="fas fa-coins"></i>
                    <span>Finanças</span>
                </a>
                <a href="#" class="nav-item" data-section="contratos">
                    <i class="fas fa-file-contract"></i>
                    <span>Contratos</span>
                </a>
            </div>

            <div class="nav-section">
                <span class="nav-title">Operações</span>
                <a href="#" class="nav-item" data-section="alertas">
                    <i class="fas fa-bell"></i>
                    <span>Alertas</span>
                    <span class="badge alert">7</span>
                </a>
                <a href="#" class="nav-item" data-section="recomendacoes">
                    <i class="fas fa-lightbulb"></i>
                    <span>Recomendações</span>
                </a>
                <a href="#" class="nav-item" data-section="importar">
                    <i class="fas fa-file-upload"></i>
                    <span>Importar</span>
                </a>
            </div>

            <div class="nav-section">
                <span class="nav-title">Relatórios</span>
                <a href="#" class="nav-item" data-section="relatorios">
                    <i class="fas fa-file-pdf"></i>
                    <span>Gerar PDF</span>
                </a>
                <a href="#" class="nav-item" data-section="email">
                    <i class="fas fa-envelope"></i>
                    <span>Email</span>
                </a>
            </div>
        </nav>

        <div class="sidebar-footer">
            <div class="connection-status">
                <span class="status-dot online"></span>
                <span>Sistema Online</span>
            </div>
            <small>v1.0.0 • 2026</small>
        </div>
    </aside>

    <!-- OVERLAY para mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
        <!-- TOP BAR -->
        <header class="topbar">
            <div class="topbar-left">
                <h1 id="pageTitle">Dashboard de Vendas</h1>
                <p id="pageSubtitle">Visão consolidada dos 14 postos Pomobel</p>
            </div>
            <div class="topbar-right">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Pesquisar posto, produto, funcionário...">
                </div>
                <button class="icon-btn" title="Notificações">
                    <i class="fas fa-bell"></i>
                    <span class="notif-badge">7</span>
                </button>
                <button class="icon-btn" title="Ajuda">
                    <i class="fas fa-question-circle"></i>
                </button>
                <div class="topbar-date">
                    <i class="fas fa-calendar-day"></i>
                    <span id="currentDate"></span>
                </div>
            </div>
        </header>

        <!-- ÁREA DE CONTEÚDO DINÂMICO -->
        <div class="content-area" id="contentArea">
            <!-- Conteúdo carregado dinamicamente -->
        </div>
    </main>

    <!-- TOAST NOTIFICATIONS -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Modal</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/modules.js"></script>
    <script src="js/pdf.js"></script>
    <script src="js/email.js"></script>
    <script src="js/ai-pomo.js"></script>
</body>
</html>
